# Tiny 64 x 64 block world that wraps in every direction (the 4x4 torus experiment).
# Copy to config/seamless_world_wrap.properties to use it for NEW worlds made without the
# Create World screen (e.g. a dedicated server). In singleplayer, pick these on the World Wrap tab.
wrapEastWest=true
wrapNorthSouth=true
widthChunks=4
lengthChunks=4
blendWidth=16
end=same
